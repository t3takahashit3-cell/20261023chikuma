<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chikuma Quest</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --main-bg: #000;
    --main-color: #fff;
    --win-border: 4px solid #fff;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: var(--main-bg);
    color: var(--main-color);
    font-family: 'DotGothic16', sans-serif;
    text-align: center;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    max-width: 600px;
    margin: 0 auto;
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 20px 0;
  }
  .screen.active {
    display: flex;
  }
  .window {
    border: var(--win-border);
    border-radius: 8px;
    padding: 16px;
    background-color: var(--main-bg);
    margin: 10px;
    width: calc(100% - 40px);
    box-sizing: border-box;
    text-align: left;
    line-height: 1.5;
    font-size: 1.1rem;
  }
  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .img-container {
    width: 90%;
    max-width: 400px;
    margin: 10px auto;
  }
  button {
    font-family: 'DotGothic16', sans-serif;
    background: var(--main-bg);
    color: var(--main-color);
    border: 2px solid var(--main-color);
    padding: 10px 16px;
    margin: 6px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 1rem;
    transition: all 0.2s;
  }
  button:hover, button:active {
    background: var(--main-color);
    color: var(--main-bg);
  }
  .choice-btn {
    display: block;
    width: 100%;
    text-align: left;
  }
  input[type="text"] {
    font-family: 'DotGothic16', sans-serif;
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    padding: 8px;
    font-size: 1rem;
    width: 80%;
    text-align: center;
    margin: 10px 0;
  }
  .checkbox-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    text-align: left;
    margin: 10px 0;
  }
  .checkbox-grid label {
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .checkbox-grid input {
    margin-right: 8px;
    transform: scale(1.5);
  }

  /* Header (HP & Items) */
  #status-bar {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-between;
    padding: 10px;
    box-sizing: border-box;
    z-index: 10;
    background: rgba(0,0,0,0.8);
    border-bottom: 2px solid #fff;
  }
  .hp-box {
    font-size: 1.2rem;
    font-weight: bold;
    display: flex;
    align-items: center;
  }
  .item-box button {
    padding: 4px 8px;
    font-size: 0.9rem;
    margin: 0 0 0 5px;
    position: relative;
  }
  .item-box button::after {
    content: attr(data-tooltip);
    position: absolute;
    top: 100%;
    right: 0;
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    padding: 4px 8px;
    white-space: nowrap;
    font-size: 0.8rem;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s;
  }
  .item-box button:hover::after {
    opacity: 1;
    visibility: visible;
  }

  /* Animations */
  .fade-in {
    animation: fadeIn 2s forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .shake {
    animation: shakeAnim 0.5s infinite;
  }
  @keyframes shakeAnim {
    0% { transform: translate(2px, 1px) rotate(0deg); }
    10% { transform: translate(-1px, -2px) rotate(-1deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    30% { transform: translate(0px, 2px) rotate(0deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    50% { transform: translate(-1px, 2px) rotate(-1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    70% { transform: translate(2px, 1px) rotate(-1deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    90% { transform: translate(2px, 2px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
  }
  .slash {
    animation: slashAnim 0.8s forwards;
  }
  @keyframes slashAnim {
    0% { transform: translateX(0) skewX(0); opacity: 1; filter: brightness(1); }
    20% { transform: translateX(-10px) skewX(-15deg); filter: brightness(2); }
    100% { transform: translateX(50px) skewX(-30deg); opacity: 0; }
  }

  /* Helpers */
  .hidden { display: none !important; }
  .text-highlight { color: #ffff00; }
</style>
</head>

// --- 音声・Audio API ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playPip() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.03);
}

function playBuzzer() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.3);
}

function playEncounterSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  
  // ピロピロピロ...というレトロなエンカウント音（高速アルペジオ）
  for(let i = 0; i < 10; i++) {
    osc.frequency.setValueAtTime(600, t + i * 0.05);
    osc.frequency.setValueAtTime(800, t + i * 0.05 + 0.025);
  }
  
  gain.gain.setValueAtTime(0.05, t);
  gain.gain.linearRampToValueAtTime(0, t + 0.5);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.5);
}

// --- 画面切り替え ---
function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function updateStatus() {
  document.getElementById('hp-value').textContent = hp;
  if(hasHerb) document.getElementById('btn-herb').classList.remove('hidden');
  else document.getElementById('btn-herb').classList.add('hidden');
  
  if(hasWand) document.getElementById('btn-wand').classList.remove('hidden');
  else document.getElementById('btn-wand').classList.add('hidden');
}

// --- タイプライター演出 ---
function typeWriter(elementId, text, speed, onComplete) {
  const el = document.getElementById(elementId);
  el.innerHTML = "";
  let i = 0;
  
  function type() {
    if (i < text.length) {
      if(text.charAt(i) === '\n') {
        el.innerHTML += "<br>";
      } else {
        el.innerHTML += text.charAt(i);
        playPip();
      }
      i++;
      setTimeout(type, speed);
    } else {
      if(onComplete) onComplete();
    }
  }
  type();
}

// --- フロー ---

  initAudio();
  const bgm = document.getElementById('bgm');
  bgm.volume = 0.3;
  bgm.play().catch(e => console.log("BGM Play Error:", e));
  
  switchScreen('screen-opening');
  
  const text = "かつて、信州の地は豊かな産業と人々の活気に満ちていた…。\nしかし、突如として現れた『無関心の魔物』たちにより、地元企業の素晴らしい技術や魅力が人々の記憶から消え去ろうとしている。\n勇者よ、そなたの中に眠る『地元企業の知識』を武器とし、立ちはだかる魔物たちを打ち破るのだ！\n信州の未来は、そなたの知識と決断にかかっている…！";
  
  typeWriter('opening-text', text, 50, () => {
    document.getElementById('btn-opening-next').classList.remove('hidden');
  });
}

function showPrologue() {
  switchScreen('screen-prologue-name');
}

function submitName() {
  const input = document.getElementById('player-name').value.trim();
  if (input !== "") {
    playerName = input;
  }
  switchScreen('screen-prologue-q1');
}

function checkPrologueQ1(ans) {
  if (ans === 2) {
    hasHerb = true;
    alert("正解！\n『薬草（HP10回復）』をゲットした！");
  } else {
    playBuzzer();
    alert("不正解…。");
  }
  switchScreen('screen-prologue-q2');
}

function checkPrologueQ2(ans) {
  if (ans === 3) {
    hasWand = true;
    alert("正解！\n『魔法の杖（選択肢を減らす）』をゲットした！");
  } else {
    playBuzzer();
    alert("不正解…。");
  }
  switchScreen('screen-prologue-q3');
}

function handleQ3CheckboxChange() {
  const checkboxes = document.querySelectorAll('#q3-checkboxes input[type="checkbox"]');
  const checkedCount = document.querySelectorAll('#q3-checkboxes input[type="checkbox"]:checked').length;
  
  // 5つチェックされたら、未チェックのものを無効化する
  if (checkedCount >= 5) {
    checkboxes.forEach(cb => {
      if (!cb.checked) cb.disabled = true;
    });
  } else {
    // 5つ未満なら全て有効化する
    checkboxes.forEach(cb => {
      cb.disabled = false;
    });
  }
}

function checkPrologueQ3() {
  const correctAnswers = ["真空ポンプ", "印刷装置", "ギター", "電機測定器", "加工用トマト"];
  const checkedBoxes = document.querySelectorAll('#q3-checkboxes input:checked');
  
  // 5つ選んでいない場合はエラーを出し、処理を中断する
  if (checkedBoxes.length !== 5) {
    alert("5つ選んでください。");
    return;
  }
  
  let score = 0;
  
  checkedBoxes.forEach(box => {
    if (correctAnswers.includes(box.value)) {
      score++;
    }
  });

  if (score === 5) hp = 100;
  else if (score >= 3) hp = 80;
  else if (score >= 1) hp = 50;
  else hp = 30;

  document.getElementById('prologue-end-text').innerHTML = `全問正解数：${score}個<br>そなたのHPは <span class="text-highlight">${hp}</span> に決定した。<br><br>旅立て、${playerName}よ！！！`;
  switchScreen('screen-prologue-end');
}

function startMainGame() {
  const bgm = document.getElementById('bgm');
  bgm.pause();
  bgm.currentTime = 0;

  document.getElementById('status-bar').classList.remove('hidden');
  updateStatus();
  currentQIndex = 0;
  loadMainQuestion();
  switchScreen('screen-main');
}

function loadMainQuestion() {
  if (currentQIndex >= mainQuestions.length) {
    showEnding();
    return;
  }

  const qData = mainQuestions[currentQIndex];
  const imgEl = document.getElementById('monster-img');
  const choicesEl = document.getElementById('main-choices');
  const textEl = document.getElementById('main-q-text');
  
  // アニメーション・表示リセット
  imgEl.className = "hidden";
  imgEl.src = "";
  choicesEl.innerHTML = "";
  textEl.innerHTML = `${qData.name} があらわれた！`;
  
  // エンカウント音を再生
  playEncounterSound();
  
  // 1.5秒後にモンスター画像と問題・選択肢を表示
  setTimeout(() => {
    imgEl.className = "";
    
    // 大魔王登場エフェクト
    if (qData.img.includes('mao.gif')) {
      if (!maoAppeared) {
        imgEl.classList.add('fade-in', 'shake');
        maoAppeared = true;
      }
    }

    imgEl.src = qData.img;
    textEl.innerHTML = qData.q;
    
    // 選択肢のランダム化
    let indices = qData.choices.map((_, idx) => idx);
    indices.sort(() => Math.random() - 0.5);

    indices.forEach(idx => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.id = 'main-choice-' + idx;
      btn.innerText = qData.choices[idx]; // 元の番号表示は消してテキストのみ
      btn.onclick = () => checkMainAnswer(idx);
      choicesEl.appendChild(btn);
    });
  }, 1500);
}

function checkMainAnswer(selectedIdx) {
  const qData = mainQuestions[currentQIndex];
  
  if (selectedIdx === qData.ans) {
    // 正解演出
    const imgEl = document.getElementById('monster-img');
    imgEl.className = ""; // clear previous
    // reflow
    void imgEl.offsetWidth;
    imgEl.classList.add('slash');
    
    setTimeout(() => {
      if (qData.resultMsg) {
        document.getElementById('result-message-text').innerText = qData.resultMsg;
        switchScreen('screen-message');
      } else {
        nextMainQuestion();
      }
    }, 800);
    
  } else {
    // 不正解
    playBuzzer();
    hp -= 10;
    updateStatus();
    if (hp <= 0) {
      document.getElementById('status-bar').classList.add('hidden');
      switchScreen('screen-gameover');
      document.querySelector('#screen-gameover .window p').innerHTML = `おお ${playerName} よ！<br>死んでしまうとは なにごとだ！`;
    } else {
      // 画面を少し揺らすペナルティ演出
      const mainScreen = document.getElementById('screen-main');
      mainScreen.classList.add('shake');
      setTimeout(() => mainScreen.classList.remove('shake'), 500);
    }
  }
}

function nextMainQuestion() {
  currentQIndex++;
  switchScreen('screen-main');
  loadMainQuestion();
}

// --- アイテム機能 ---
function useHerb() {
  if (!hasHerb) return;
  hp += 10;
  hasHerb = false;
  alert("薬草を使った！\nHPが10回復した！");
  updateStatus();
}

function useWand() {
  if (!hasWand) return;
  const qData = mainQuestions[currentQIndex];
  const wrongIndices = [];
  
  for(let i=0; i<qData.choices.length; i++) {
    if(i !== qData.ans) wrongIndices.push(i);
  }
  
  // 2つランダムに選んで隠す
  for(let i=0; i<2; i++) {
    if(wrongIndices.length > 0) {
      const r = Math.floor(Math.random() * wrongIndices.length);
      const targetIdx = wrongIndices.splice(r, 1)[0];
      const btn = document.getElementById('main-choice-' + targetIdx);
      if(btn) btn.style.display = 'none';
    }
  }
  
  hasWand = false;
  alert("魔法の杖を使った！\n選択肢が減った！");
  updateStatus();
}

function showEnding() {
  document.getElementById('status-bar').classList.add('hidden');
  switchScreen('screen-ending');
  
  const edBgm = document.getElementById('ed-bgm');
  edBgm.volume = 0.3;
  edBgm.play().catch(e => console.log("ED BGM Play Error:", e));
  
  const text = `おお、勇者 ${playerName} よ！\nそなたの知識が信州の魔物たちを見事打ち払った！\n\n見えないところで社会を支える地元企業たち。\n彼らの本当の姿を知ることで、\n新しい世界が開けたはずだ。\n\nこれからの未来を創るのは君だ！\nクエストクリア、おめでとう！！`;
  
  typeWriter('ending-text', text, 80);
}

</script>
